import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Package the font used by MaterialCommunityIcons on Android.
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

googleServices {
    // Keep local builds working until android/app/google-services.json is added.
    missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
def localPropertiesFile = rootProject.file("local.properties")
def localSigningProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localSigningProperties.load(stream)
    }
}
def releaseSigningValue = { name ->
    def value = project.findProperty(name)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = localSigningProperties.getProperty(name)
    }
    return value == null ? null : value.toString().trim()
}
def releaseStoreFile = releaseSigningValue("HOSTEL_UPLOAD_STORE_FILE")
def releaseStorePassword = releaseSigningValue("HOSTEL_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = releaseSigningValue("HOSTEL_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = releaseSigningValue("HOSTEL_UPLOAD_KEY_PASSWORD")
def hasReleaseSigningValues = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def releaseStoreFileResolved = releaseStoreFile ? file(releaseStoreFile) : null
def hasReleaseKeystoreFile = releaseStoreFileResolved != null && releaseStoreFileResolved.exists()
def debugKeystoreFile = file("debug.keystore")
def usesDebugKeystoreForRelease = hasReleaseKeystoreFile &&
    releaseStoreFileResolved.canonicalPath == debugKeystoreFile.canonicalPath
def hasReleaseSigning = hasReleaseSigningValues && hasReleaseKeystoreFile && !usesDebugKeystoreForRelease
def hasFirebaseConfig = file("google-services.json").exists()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hostelappmanagementsystem"
    defaultConfig {
        applicationId "com.hostelappmanagementsystem"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigningValues) {
            release {
                storeFile releaseStoreFileResolved
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (releaseTaskRequested && !hasReleaseSigning) {
        def missingSigningMessage = !hasReleaseSigningValues
            ? "Release builds require HOSTEL_UPLOAD_STORE_FILE, HOSTEL_UPLOAD_STORE_PASSWORD, " +
              "HOSTEL_UPLOAD_KEY_ALIAS and HOSTEL_UPLOAD_KEY_PASSWORD in android/local.properties, " +
              "as Gradle properties or as environment variables."
            : usesDebugKeystoreForRelease
              ? "Release builds must not use android/app/debug.keystore. " +
                "Create a private upload keystore and set HOSTEL_UPLOAD_STORE_FILE to that file."
            : "Release keystore file does not exist: ${releaseStoreFileResolved}. " +
              "Set HOSTEL_UPLOAD_STORE_FILE to an existing .jks or .keystore file."
        throw new GradleException(
            missingSigningMessage
        )
    }
    if (releaseTaskRequested && !hasFirebaseConfig) {
        throw new GradleException("Release builds require android/app/google-services.json for Firebase/FCM.")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.fresco:animated-gif:3.6.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
